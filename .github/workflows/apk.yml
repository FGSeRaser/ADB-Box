# ADB Box – APK bauen und als Release veröffentlichen (von FGSeRaser)
name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signierschlüssel
        env:
          KEYSTORE_B64: ${{ secrets.ADBBOX_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/adbbox.jks"
            echo "ADBBOX_KEYSTORE_DATEI=$RUNNER_TEMP/adbbox.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Secret ADBBOX_KEYSTORE – die APK wird nur mit Debug-Schlüssel signiert."
          fi

      - name: Bauen
        env:
          ADBBOX_KEYSTORE_PASS: ${{ secrets.ADBBOX_KEYSTORE_PASS }}
        run: |
          gradle --no-daemon assembleRelease
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ausgabe
          cp app/build/outputs/apk/release/app-release.apk "ausgabe/ADB-Box-$VERSION.apk"

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ADB Box ${{ env.VERSION }}
          make_latest: true
          files: ausgabe/*.apk
          body: |
            **ADB Box** – SSH-Konsole, Dateien & APKs verschieben, Apps verwalten und Bildschirm spiegeln (wie scrcpy) – direkt vom Handy.
            von [FGSeRaser](https://github.com/FGSeRaser)

            **Installieren:** APK unten herunterladen und öffnen. Neue Versionen meldet die App von selbst.

      # Nur die neuesten 3 Releases behalten (sortiert nach Versionsnummer)
      - name: Alte Releases löschen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq "map(select(.tagName | test(\"^v[0-9]+(\\\\.[0-9]+)*$\"))) | sort_by(.tagName | ltrimstr(\"v\") | split(\".\") | map(tonumber)) | reverse | .[3:] | .[].tagName" |
          while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          done
